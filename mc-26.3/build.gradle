// Minecraft 26.x ships unobfuscated, so this build uses the non-remapping Loom:
// no mappings, and plain implementation/compileOnly instead of the mod* configurations.
plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

apply from: '../gradle/common.gradle'

repositories {
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/releases/'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${resolveLoader()}"
    implementation "net.fabricmc.fabric-api:fabric-api:${resolveFabricApi(minecraft_version)}"

    // Only needed to compile the Mod Menu config-screen entrypoint.
    compileOnly "com.terraformersmc:modmenu:${resolveModMenu()}"
}
