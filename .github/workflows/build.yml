name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      # One Minecraft version failing must not hide the result of the others.
      fail-fast: false
      matrix:
        mc: ['1.21.11', '26.1', '26.2', '26.3']
    steps:
      - uses: actions/checkout@v4

      # Gradle runs on Java 25. The 1.21.11 build still targets Java 21 bytecode
      # (see java_version in mc-1.21.11/gradle.properties).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build ${{ matrix.mc }}
        run: |
          chmod +x gradlew
          ./gradlew -p mc-${{ matrix.mc }} build --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: bloodfx-${{ matrix.mc }}
          path: |
            mc-${{ matrix.mc }}/build/libs/*.jar
            !mc-${{ matrix.mc }}/build/libs/*-sources.jar
            !mc-${{ matrix.mc }}/build/libs/*-dev.jar

  release:
    # Pushing a tag like v1.0.0 attaches every jar to a GitHub release.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: jars
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: jars/*.jar
          generate_release_notes: true
